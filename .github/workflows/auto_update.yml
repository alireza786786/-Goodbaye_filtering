name: Auto Update Subscriptions

on:
  schedule:
    # اجرای خودکار هر ۴ ساعت یک‌بار (می‌توانید زمان را تغییر دهید)
    - cron: '0 */4 * * *'
  workflow_dispatch: # امکان اجرای دستی از زبانه Actions

jobs:
  update-subs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Multi Runner Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
      run: |
        python multi_runner.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add sub*.txt
        git diff-index --quiet HEAD || git commit -m "🤖 Auto-update subscription files [skip ci]"
        git push
