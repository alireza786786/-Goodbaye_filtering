name: Auto Update Subscriptions and Proxies

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests aiohttp

    - name: Run V2Ray Subscriptions Runner
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
      run: |
        python multi_runner.py

    - name: Run Telegram Proxy Collector
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHANNEL_ID }}
      run: |
        python proxy_collector.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add sub*.txt TELEGRAM_PROXY_SUB_TXT || true
        git diff-index --quiet HEAD || git commit -m "🤖 Auto-update subscriptions & proxies [skip ci]"
        git push
